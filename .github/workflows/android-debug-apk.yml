name: Android debug APK

# Builds an installable debug APK on GitHub's runners (no local JDK / Android SDK needed)
# and publishes it to a rolling prerelease so it can be downloaded on the device.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish the APK to
        required: false
        default: apk-latest

permissions:
  contents: write

concurrency:
  group: android-debug-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is `git rev-list --count HEAD`, so the full history matters.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      # android-actions/setup-android@v3 currently dies on `sdkmanager tools`,
      # so accept the preinstalled SDK's licenses directly instead. AGP then
      # downloads the API 37 platform / build-tools it needs on its own.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-37" "platform-tools" 2>&1 | tail -2 || true
          fi
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure local.properties
        # compileSdk 37 is not on the runner image yet; AGP downloads the missing
        # platform itself once the SDK licenses are accepted (setup-android above).
        # Real keys come from repo secrets when set; otherwise a build-only
        # placeholder keeps configuration working (those photo providers stay
        # unusable in the APK until the real keys are provided).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'SUPABASE_URL=%s\n' "${SUPABASE_URL:-https://compile-only.invalid}"
            printf 'SUPABASE_ANON_KEY=%s\n' "${SUPABASE_ANON_KEY:-compile-only}"
            printf 'SENTRY_DSN=%s\n' "${SENTRY_DSN:-https://compile-only.invalid/1}"
            printf 'PEXELS_API_KEY=%s\n' "${PEXELS_API_KEY:-compile-only}"
            printf 'UNSPLASH_API_KEY=%s\n' "${UNSPLASH_API_KEY:-compile-only}"
            printf 'TMDB_API_KEY=%s\n' "${TMDB_API_KEY:-compile-only}"
          } > local.properties
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            'kotlin.daemon.jvmargs=-Xmx2g' \
            'org.gradle.parallel=false' \
            'org.gradle.workers.max=2' >> gradle.properties

      - name: Assemble debug APK
        run: >
          sh scripts/gradle-platform.sh standard
          :androidApp:assembleDebug
          --no-daemon --console=plain --stacktrace

      - name: Run orientation / screen-off unit tests
        # Non-blocking: the APK is the deliverable. These are the checks covering the
        # gravity-sensor filter and the screen-off window, and their compilation is
        # itself a check that the shared (commonTest) sources still build.
        continue-on-error: true
        run: |
          sh scripts/gradle-platform.sh standard :composeApp:desktopTest \
            --tests "com.alpha.showcase.common.ui.play.*" --no-daemon --console=plain \
          || sh scripts/gradle-platform.sh standard :composeApp:tasks --all \
            --no-daemon --console=plain | grep -i 'test' | sort -u

      - name: Collect APKs
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/debug -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist
          test -n "$(ls -A dist)"

      - uses: actions/upload-artifact@v4
        with:
          name: showcase-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to rolling release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-apk-latest}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease \
              --title "ShowcaseApp debug APK" \
              --notes "Built from ${GITHUB_SHA} on $(date -u +%FT%TZ)"
          # Replace older builds so the newest APK is the only download.
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$TAG" "$asset" --yes || true
          done
          gh release upload "$TAG" dist/*.apk --clobber
